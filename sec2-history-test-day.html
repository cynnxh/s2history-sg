<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sec 2 History — Test Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --beige: #F0EDE8;
    --green: #1C3A2E;
    --green-soft: rgba(28,58,46,0.08);
    --green-mid: rgba(28,58,46,0.16);
    --amber: #C97A2B;
    --amber-soft: rgba(201,122,43,0.12);
    --good: #2f6b4f;
    --bad: #a13d3d;
  }
  * { box-sizing: border-box; }
  body { background: var(--beige); font-family: 'DM Sans', Arial, sans-serif; color: var(--green); margin: 0; padding-bottom: 62px; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 70px; }
  h1 { font-family: 'Lora', Georgia, serif; font-size: 20px; margin: 4px 0 2px; }
  .subtitle { font-size: 12.5px; opacity: 0.78; line-height: 1.5; margin-bottom: 16px; }

  .statusbar { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin-bottom: 12px; background: #fff; border: 1px solid var(--green-mid); padding: 8px 12px; border-radius: 8px; }
  .statusbar b { font-size: 16px; color: var(--amber); }
  .progress-track { height: 5px; background: var(--green-mid); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: var(--amber); width: 0%; transition: width 0.3s; }

  .card { background: #fff; border: 1px solid var(--green-mid); border-radius: 10px; padding: 18px 18px 16px; margin-bottom: 12px; }
  .qtype { display: inline-block; font-size: 10px; letter-spacing: 0.3px; background: var(--green-soft); color: var(--green); padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-bottom: 10px; opacity: 0.7; }
  .qtext { font-family: 'Lora', serif; font-size: 17px; font-weight: 700; line-height: 1.45; margin-bottom: 14px; }

  input[type=text] { width: 100%; border: 1px solid var(--green-mid); border-radius: 8px; padding: 11px 12px; font-family: inherit; font-size: 14px; color: var(--green); background: var(--beige); margin-bottom: 10px; }
  input[type=text]:focus { outline: 2px solid var(--amber); }

  .btn { background: var(--green); color: var(--beige); border: none; border-radius: 6px; padding: 10px 16px; font-size: 13.5px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn:hover { opacity: 0.88; }
  .btn.secondary { background: none; border: 1px solid var(--green); color: var(--green); }
  .btn.gold { background: var(--amber); color: var(--green); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .reveal { display: none; margin-top: 4px; padding: 10px 12px; background: var(--amber-soft); border-left: 3px solid var(--amber); border-radius: 0 6px 6px 0; font-size: 13.5px; line-height: 1.5; margin-bottom: 12px; }
  .reveal.show { display: block; }
  .reveal b { color: var(--green); }

  .mark-row { display: none; gap: 10px; }
  .mark-row.show { display: flex; }
  .mark-btn { flex: 1; border: 1px solid var(--green); background: #fff; color: var(--green); border-radius: 8px; padding: 10px 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; }
  .mark-btn.correct.active { background: rgba(47,107,79,0.18); border-color: var(--good); }
  .mark-btn.wrong.active { background: rgba(161,61,61,0.15); border-color: var(--bad); }

  .start-screen { text-align: center; padding: 20px 6px; }
  .start-screen .big { font-family: 'Lora', serif; font-size: 22px; margin-bottom: 8px; }
  .start-screen p { font-size: 13px; opacity: 0.8; line-height: 1.55; margin-bottom: 18px; }
  .start-screen .btn { padding: 12px 26px; font-size: 15px; }

  .result-screen { text-align: center; padding: 20px 6px; }
  .result-screen .big { font-family: 'Lora', serif; font-size: 30px; margin-bottom: 4px; color: var(--amber); }
  .breakdown { text-align: left; margin: 18px 0; }
  .breakdown-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .breakdown-row .label { width: 76px; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }
  .breakdown-bar-track { flex: 1; height: 10px; background: var(--green-mid); border-radius: 5px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; background: var(--good); }
  .breakdown-bar-fill.weak { background: var(--bad); }
  .breakdown-score { font-size: 12px; width: 34px; text-align: right; flex-shrink: 0; }
  .weakest-note { font-size: 13px; background: var(--green-soft); padding: 12px 14px; border-radius: 8px; margin-top: 10px; line-height: 1.5; }
  .weakest-note a { color: var(--amber); font-weight: 700; text-decoration: none; }

  .hv-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--green); border-top: 2px solid var(--amber); display: flex; align-items: center; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .hv-nav a { flex: 0 0 auto; min-width: 40px; text-align: center; color: var(--beige); text-decoration: none; font-size: 10.5px; font-weight: 600; padding: 6px 7px; border-radius: 6px; opacity: 0.7; white-space: nowrap; }
  .hv-nav a.active { opacity: 1; background: rgba(240,237,232,0.15); color: var(--amber); }
  .hv-streak { color: var(--amber); font-size: 10.5px; font-weight: 700; padding: 0 8px; white-space: nowrap; flex: 0 0 auto; margin-left: 6px; }

  .footer-note { text-align: center; font-size: 11px; opacity: 0.6; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Test Day</h1>
  <div class="subtitle">20 short-answer questions, mixed randomly across all chapters \u2014 no hints about which chapter each one is from. This is meant to feel like the real thing.</div>

  <div id="app"></div>

  <div class="footer-note">Sec 2 History — Test Day — self-marked, not saved</div>
</div>

<nav class="hv-nav">
  <a href="sec2-history-hub.html">Hub</a>
  <a href="sec2-history-ch5-shortanswer-quiz.html">Ch5</a>
  <a href="sec2-history-ch6-tier1-games.html">Ch6</a>
  <a href="sec2-history-ch7-tier1-games.html">Ch7</a>
  <a href="sec2-history-ch8-tier1-games.html">Ch8</a>
  <a href="sec2-history-boss-battle.html">Boss</a>
  <a href="sec2-history-exam-bank.html">Exam</a>
  <a href="sec2-history-test-day.html" class="active">Test</a>
  <span class="hv-streak" id="hv-streak"></span>
</nav>

<script>
function shuffledCopy(arr) { return [...arr].sort(() => Math.random() - 0.5); }

/* ---------- STREAK ---------- */
function hvStreak(markCompleted) {
  const today = new Date().toISOString().slice(0, 10);
  let data = {};
  try { data = JSON.parse(localStorage.getItem('historyVaultStreak') || '{}'); } catch (e) { data = {}; }
  if (markCompleted && data.lastDate !== today) {
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const yesterday = y.toISOString().slice(0, 10);
    data.streak = (data.lastDate === yesterday) ? (data.streak || 0) + 1 : 1;
    data.lastDate = today;
    try { localStorage.setItem('historyVaultStreak', JSON.stringify(data)); } catch (e) {}
  }
  const el = document.getElementById('hv-streak');
  if (el) el.textContent = data.streak ? ('\uD83D\uDD25 ' + data.streak) : '';
}
hvStreak(false);

/* ---------- QUESTION BANK ---------- */
const chapterNames = { ch5: "Ch5 \u2014 Fall of Singapore", ch6: "Ch6 \u2014 Japanese Occupation", ch7: "Ch7 \u2014 Return of the British", ch8: "Ch8 \u2014 Merger & Separation" };
const chapterLink = { ch5: "sec2-history-ch5-shortanswer-quiz.html", ch6: "sec2-history-ch6-tier1-games.html#speed", ch7: "sec2-history-ch7-tier1-games.html#speed", ch8: "sec2-history-ch8-tier1-games.html#speed" };

const bank = [
  {ch:"ch5", type:"Date", q:"What date did Singapore fall to the Japanese?", answer:"15 February 1942"},
  {ch:"ch5", type:"Nickname", q:"What nickname did pilots give Britain's outdated Buffalo fighter planes?", answer:"Flying coffins"},
  {ch:"ch5", type:"Name", q:"Which British general surrendered Singapore to the Japanese?", answer:"Lieutenant-General Percival"},
  {ch:"ch5", type:"Name", q:"Name the two British warships sunk on 10 December 1941, together known as Force Z.", answer:"HMS Prince of Wales and HMS Repulse"},
  {ch:"ch5", type:"Name", q:"Which Japanese general led the forces that captured Singapore?", answer:"General Yamashita (Tomoyuki Yamashita)"},
  {ch:"ch6", type:"Term", q:"What name did the Japanese give Singapore during the Occupation?", answer:"Syonan-to"},
  {ch:"ch6", type:"Number", q:"What was the age range of Chinese men required to report for Sook Ching screening?", answer:"18 to 50"},
  {ch:"ch6", type:"Term", q:"What was the Japanese military police force called?", answer:"Kempeitai"},
  {ch:"ch6", type:"Number", q:"How many Straits dollars did the Japanese demand from the Overseas Chinese Association?", answer:"$50 million"},
  {ch:"ch6", type:"Date", q:"On what date did Japan announce its unconditional surrender?", answer:"15 August 1945"},
  {ch:"ch7", type:"Date", q:"In what year did the Maria Hertogh Riots take place?", answer:"1950"},
  {ch:"ch7", type:"Name", q:"Who became Singapore's first Chief Minister in 1955?", answer:"David Marshall"},
  {ch:"ch7", type:"Term", q:"What commission recommended Singapore's first partly elected government?", answer:"The Rendel Commission"},
  {ch:"ch7", type:"Date", q:"In what year did Singapore gain full internal self-government?", answer:"1957"},
  {ch:"ch7", type:"Number", q:"How many of the 51 seats did the PAP win in the 1959 election?", answer:"43"},
  {ch:"ch8", type:"Date", q:"In what year did Singapore separate from Malaysia?", answer:"1965 (9 August 1965)"},
  {ch:"ch8", type:"Term", q:"What was Indonesia's campaign of hostility against the newly formed Malaysia called?", answer:"Konfrontasi"},
  {ch:"ch8", type:"Number", q:"What percentage did the Federal Government raise Singapore's revenue contribution to?", answer:"60%"},
  {ch:"ch8", type:"Term", q:"What was the party formed by PAP members who broke away over the merger issue in 1961?", answer:"Barisan Sosialis"},
  {ch:"ch8", type:"Date", q:"On what date did Singapore officially join the Federation of Malaysia?", answer:"16 September 1963"}
];

let quizOrder = [];
let idx = 0;
let results = [];

function renderStart() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="start-screen">
        <div class="big">Ready?</div>
        <p>20 questions, chapters shuffled together and hidden until the end. Type what you remember, check it, then be honest with yourself when you self-mark.</p>
        <button class="btn gold" id="start-btn">Start Test</button>
      </div>
    </div>`;
  document.getElementById('start-btn').addEventListener('click', startQuiz);
}

function startQuiz() {
  quizOrder = shuffledCopy(bank);
  idx = 0;
  results = [];
  renderQuestion();
}

function renderQuestion() {
  if (idx >= quizOrder.length) {
    renderResults();
    return;
  }
  const item = quizOrder[idx];
  const pct = Math.round((idx / quizOrder.length) * 100);
  document.getElementById('app').innerHTML = `
    <div class="statusbar"><span>Question <b>${idx + 1}</b> / ${quizOrder.length}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="card">
      <div class="qtype">${item.type}</div>
      <div class="qtext">${item.q}</div>
      <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off">
      <button class="btn" id="check-btn">Check</button>
      <div class="reveal" id="reveal-box"><b>Accepted answer:</b> ${item.answer}</div>
      <div class="mark-row" id="mark-row">
        <button class="mark-btn correct" data-v="1">\u2713 I had it right</button>
        <button class="mark-btn wrong" data-v="0">\u2717 I didn't have it</button>
      </div>
    </div>`;

  document.getElementById('check-btn').addEventListener('click', () => {
    document.getElementById('reveal-box').classList.add('show');
    document.getElementById('mark-row').classList.add('show');
    document.getElementById('check-btn').disabled = true;
  });

  document.querySelectorAll('.mark-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mark-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      results.push({ch: item.ch, correct: btn.dataset.v === '1'});
      setTimeout(() => { idx++; renderQuestion(); }, 350);
    });
  });

  document.getElementById('answer-input').focus();
}

function renderResults() {
  hvStreak(true);
  const totalCorrect = results.filter(r => r.correct).length;
  const chStats = {};
  ['ch5', 'ch6', 'ch7', 'ch8'].forEach(ch => { chStats[ch] = {correct: 0, total: 0}; });
  results.forEach(r => { chStats[r.ch].total++; if (r.correct) chStats[r.ch].correct++; });

  let weakestCh = null, weakestRatio = 2;
  Object.keys(chStats).forEach(ch => {
    const s = chStats[ch];
    const ratio = s.total ? s.correct / s.total : 1;
    if (ratio < weakestRatio) { weakestRatio = ratio; weakestCh = ch; }
  });

  const barsHtml = Object.keys(chStats).map(ch => {
    const s = chStats[ch];
    const pct = s.total ? Math.round((s.correct / s.total) * 100) : 0;
    const weak = s.total && (s.correct / s.total) < 0.6;
    return `<div class="breakdown-row">
      <div class="label">${ch.toUpperCase()}</div>
      <div class="breakdown-bar-track"><div class="breakdown-bar-fill ${weak ? 'weak' : ''}" style="width:${pct}%;"></div></div>
      <div class="breakdown-score">${s.correct}/${s.total}</div>
    </div>`;
  }).join('');

  const weakNote = weakestCh
    ? `<div class="weakest-note">Weakest spot this time: <b>${chapterNames[weakestCh]}</b>. Worth a quick <a href="${chapterLink[weakestCh]}">Speed Round</a> on that chapter before the next Test Day.</div>`
    : '';

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="result-screen">
        <div class="big">${totalCorrect} / ${quizOrder.length}</div>
        <div style="font-size:13px; opacity:0.75;">self-marked score</div>
        <div class="breakdown">${barsHtml}</div>
        ${weakNote}
        <button class="btn secondary" id="retry-btn" style="margin-top:16px;">Take Test Day again</button>
      </div>
    </div>`;
  document.getElementById('retry-btn').addEventListener('click', renderStart);
}

renderStart();
</script>
</body>
</html>
